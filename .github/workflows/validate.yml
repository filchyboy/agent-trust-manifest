name: validate

on:
  push:
  pull_request:

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Bootstrap patched pip with the Python security advisory's digest
        run: >-
          python -m pip --isolated --disable-pip-version-check install --no-cache-dir --no-deps
          'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
      - run: python -m pip install -r requirements.txt
      - run: python tools/validator/check_examples.py --strict-formats
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/signing/check_vectors.py
      - run: python tools/signing/check_consumer_vectors.py
      - run: node tools/signing/interop.mjs
      - run: npm ci --ignore-scripts --prefix tools/independent-verifier
      - run: npm test --prefix tools/independent-verifier
      - run: python -m unittest discover -s tests
